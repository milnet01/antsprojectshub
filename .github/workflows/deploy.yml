name: Build & deploy

# Builds the static site from src/projects.json (pulling each project's README +
# latest release from GitHub) and deploys dist/ to GitHub Pages.
# Runs on every push to main and daily, so project pages stay fresh.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *" # daily ~05:00 UTC — refresh READMEs/releases
  workflow_dispatch:

# Least privilege: read the repo, write Pages, mint the OIDC token for deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # local-CI.sh owns the build: the Node version and every build step live there,
      # and this job calls it, so the pre-push gate and CI cannot drift. Only the Pages
      # steps below are the workflow's own — they cannot run locally.
      - name: Read the Node version
        id: pins
        run: echo "node=$(./local-CI.sh --print-node-major)" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
      - name: Install and build (local-CI.sh)
        run: ./local-CI.sh --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
